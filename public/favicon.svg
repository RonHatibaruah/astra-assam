<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />

  <!-- Radar / Spatial Scanning Waves (ASSAC Space / GIS) -->
  <path d="M 12 24 A 24 24 0 0 1 52 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="3 3" />
  <path d="M 18 26 A 16 16 0 0 1 46 26" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Converging Smart Highway (Arterial Corridor) -->
  <path d="M 16 54 L 28 26 L 36 26 L 48 54 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Road Center Dashed Line (Green Wave Active) -->
  <line x1="32" y1="28" x2="32" y2="52" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4" filter="url(#glow)" />

  <!-- Intelligent Central Beacon / Satellite Pulse Node -->
  <circle cx="32" cy="22" r="5" fill="#10b981" filter="url(#glow)" />
  <circle cx="32" cy="22" r="2" fill="#ffffff" />

  <!-- Lateral Emergency / Traffic Signal Indicator Nodes -->
  <circle cx="16" cy="18" r="3" fill="#ef4444" />
  <circle cx="48" cy="18" r="3" fill="#10b981" />
</svg>
